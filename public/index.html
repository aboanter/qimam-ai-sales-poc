<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Qimam AI Sales</title><script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,sans-serif;background:#f5f7fb;color:#111827}.hero{background:linear-gradient(135deg,#111a34,#302c83);color:white;padding:28px 18px 24px;border-radius:0 0 30px 30px}.wrap{max-width:900px;margin:auto}h1{margin:0 0 7px;font-size:30px}.sub{opacity:.8;margin-bottom:18px}.ask{display:flex;gap:8px}.ask input{flex:1;border:0;border-radius:16px;padding:16px;font-size:17px;min-width:0}.ask button{border:0;border-radius:16px;padding:0 22px;background:#22c55e;font-weight:800;font-size:17px}.examples{display:flex;gap:8px;overflow:auto;padding:14px 0 0}.chip{white-space:nowrap;border:1px solid #ffffff40;background:#ffffff12;color:white;padding:8px 12px;border-radius:999px}.main{padding:18px}.card{background:white;border:1px solid #e5e7eb;border-radius:20px;padding:18px;margin-bottom:16px;box-shadow:0 8px 30px #1118270c}.q{font-weight:700;color:#4338ca;margin-bottom:12px}.badge{display:inline-block;background:#dcfce7;color:#166534;padding:6px 10px;border-radius:999px;font-size:12px;font-weight:800}.summary{line-height:1.9;color:#374151}.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px;margin:14px 0}.kpi{background:#f8fafc;border:1px solid #e5e7eb;border-radius:16px;padding:14px}.kpi b{display:block;font-size:20px;margin-top:7px}.block{margin:18px 0}.block h3{font-size:15px}.chart{height:310px;position:relative}.tablewrap{overflow:auto}.tablewrap table{border-collapse:collapse;width:100%;min-width:520px}.tablewrap th,.tablewrap td{padding:10px;border-bottom:1px solid #eee;text-align:right}.insight{padding:13px;border-radius:13px;background:#eff6ff;line-height:1.8}.warning{background:#fff7ed}.positive{background:#ecfdf5}.debug{margin-top:14px}.debug summary{cursor:pointer;font-weight:700}.debug pre{direction:ltr;text-align:left;white-space:pre-wrap;word-break:break-word;background:#0b1020;color:#d1fae5;padding:12px;border-radius:12px;font-size:11px}.error{background:#fef2f2;color:#991b1b;padding:14px;border-radius:14px}.loading{padding:20px;text-align:center;color:#6b7280}@media(max-width:520px){h1{font-size:26px}.ask{flex-direction:column}.ask button{height:52px}.chart{height:270px}}</style></head><body><div class="hero"><div class="wrap"><h1>Qimam AI Sales</h1><div class="sub">اسأل عن مبيعات 2025 بأي طريقة تريد — التحليل والعرض يبنيهما Claude مباشرة</div><div class="ask"><input id="q" placeholder="اسألني عن المبيعات..."><button id="go">توليد</button></div><div class="examples" id="examples"></div></div></div><main class="main wrap"><div id="feed"><div class="card" id="empty">اكتب سؤالاً في الأعلى. كل نتيجة ناجحة تمر باستدعاءين حقيقيين إلى Claude API.</div></div></main><script src="engine.js"></script><script>
const DATA=generateDataset(950),feed=document.getElementById('feed'),q=document.getElementById('q'),go=document.getElementById('go');let lastPlan=null,n=0;
['كيف كان أداء المبيعات في 2025؟','هل الخصومات العالية رفعت المبيعات أم خفضت الربح؟','اكتشف لي أي شيء غير طبيعي في مبيعات 2025','قسم العملاء حسب المبيعات وهامش الربح','قارن الأرباع الأربعة'].forEach(x=>{let b=document.createElement('button');b.className='chip';b.textContent=x;b.onclick=()=>q.value=x;examples.appendChild(b)});
const esc=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
async function post(url,body){let r=await fetch(url,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)}),d=await r.json().catch(()=>({}));if(!r.ok)throw Object.assign(new Error(d.error||'HTTP '+r.status),{detail:d.detail||d.raw});return d}
function fmt(v,f){if(typeof v!=='number')return v;if(f==='currency')return new Intl.NumberFormat('ar-SA',{maximumFractionDigits:0}).format(v)+' ر.س';if(f==='percent')return new Intl.NumberFormat('ar-SA',{style:'percent',maximumFractionDigits:1}).format(v);return new Intl.NumberFormat('ar-SA',{maximumFractionDigits:2}).format(v)}
function add(tag,cls,txt){let e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
function chart(c,host){let box=add('div','block'),h=add('h3',null,c.title||''),cv=add('canvas'),wrap=add('div','chart');wrap.append(cv);box.append(h,wrap);host.append(box);let type={bar_chart:'bar',line_chart:'line',area_chart:'line',pie_chart:'doughnut',scatter_chart:'scatter'}[c.type],datasets;if(type==='scatter')datasets=[{label:c.title||'',data:(c.points||[]).map(p=>({x:p.x,y:p.y,label:p.label}))}];else datasets=(c.series||[]).map(s=>({label:s.name||'',data:s.data||[],fill:c.type==='area_chart'}));new Chart(cv,{type,data:{labels:c.categories||[],datasets},options:{responsive:true,maintainAspectRatio:false,indexAxis:c.horizontal?'y':'x',plugins:{legend:{display:datasets.length>1||type==='doughnut'}},scales:type==='doughnut'?{}:{x:{ticks:{maxRotation:45}},y:{beginAtZero:false}}}})}
function render(schema,host){if(schema.summary)host.append(add('p','summary',schema.summary));let ks=(schema.components||[]).filter(c=>c.type==='kpi');if(ks.length){let g=add('div','kpis');ks.forEach(c=>{let k=add('div','kpi');k.append(add('span',null,c.title),add('b',null,fmt(c.value,c.format)));g.append(k)});host.append(g)}for(let c of schema.components||[]){if(c.type==='kpi')continue;if(c.type.endsWith('_chart'))chart(c,host);else if(c.type==='insight'){let b=add('div','insight '+(c.severity||''),c.text);host.append(b)}else if(c.type==='table'){let b=add('div','block'),h=add('h3',null,c.title||''),w=add('div','tablewrap'),t=document.createElement('table'),thead=document.createElement('thead'),tr=document.createElement('tr');(c.columns||[]).forEach(x=>{let th=document.createElement('th');th.textContent=x;tr.append(th)});thead.append(tr);t.append(thead);let tb=document.createElement('tbody');(c.rows||[]).forEach(r=>{let tr=document.createElement('tr');r.forEach(x=>{let td=document.createElement('td');td.textContent=x;tr.append(td)});tb.append(tr)});t.append(tb);w.append(t);b.append(h,w);host.append(b)}}}
async function ask(){let text=q.value.trim();if(!text||go.disabled)return;n++;go.disabled=true;document.getElementById('empty')?.remove();let load=add('div','card loading','Claude #1 يبني خطة التحليل ← المحرك يحسب ← Claude #2 يبني العرض الديناميكي...');feed.prepend(load);try{let p=await post('/api/plan',{question:text,previousPlan:lastPlan}),results=executePlanOperations(DATA,p.plan),pr=await post('/api/present',{question:text,plan:p.plan,results}),card=add('div','card'),qr=add('div','q','سؤال '+n+': '+text),body=add('div');body.append(add('span','badge','AI MODE: LIVE CLAUDE'),add('h2',null,pr.schema.title||text));render(pr.schema,body);let det=add('details','debug'),sum=add('summary',null,'لوحة المطوّر — إثبات كل خطوة');det.append(sum);[['Model #1',p.model],['Query Plan',p.plan],['Executed factual results',results],['Model #2',pr.model],['Raw Presentation Plan',pr.rawText],['Final Dynamic UI JSON',pr.schema],['Fallback','NO — successful result used two live Claude API calls.']].forEach(([a,b])=>{det.append(add('h4',null,a),add('pre',null,typeof b==='string'?b:JSON.stringify(b,null,2)))});card.append(qr,body,det);load.replaceWith(card);lastPlan=p.plan;q.value=''}catch(e){let er=add('div','card'),b=add('div','error','فشل الطلب: '+e.message+(e.detail?'\n'+e.detail:''));er.append(b);load.replaceWith(er)}finally{go.disabled=false}}
go.onclick=ask;q.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();ask()}});
</script></body></html>
