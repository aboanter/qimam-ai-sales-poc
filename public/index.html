<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Qimam AI Sales — Odoo Live</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,sans-serif;background:#f5f7fb;color:#111827}.hero{background:linear-gradient(135deg,#111a34,#302c83);color:white;padding:28px 18px 24px;border-radius:0 0 30px 30px}.wrap{max-width:900px;margin:auto}h1{margin:0 0 7px;font-size:30px}.sub{opacity:.85;margin-bottom:18px}.ask{display:flex;gap:8px}.ask input{flex:1;border:0;border-radius:16px;padding:16px;font-size:17px;min-width:0}.ask button{border:0;border-radius:16px;padding:0 22px;background:#22c55e;font-weight:800;font-size:17px}.examples{display:flex;gap:8px;overflow:auto;padding:14px 0 0}.chip{white-space:nowrap;border:1px solid #ffffff40;background:#ffffff12;color:white;padding:8px 12px;border-radius:999px}.main{padding:18px}.card{background:white;border:1px solid #e5e7eb;border-radius:20px;padding:18px;margin-bottom:16px;box-shadow:0 8px 30px #1118270c}.q{font-weight:700;color:#4338ca;margin-bottom:12px}.badge{display:inline-block;background:#dcfce7;color:#166534;padding:6px 10px;border-radius:999px;font-size:12px;font-weight:800}.summary{line-height:1.9;color:#374151}.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px;margin:14px 0}.kpi{background:#f8fafc;border:1px solid #e5e7eb;border-radius:16px;padding:14px}.kpi b{display:block;font-size:20px;margin-top:7px}.block{margin:18px 0}.block h3{font-size:15px}.chart{width:100%;overflow-x:auto}.chart svg{width:100%;min-width:560px;height:auto;display:block}.tablewrap{overflow:auto}.tablewrap table{border-collapse:collapse;width:100%;min-width:520px}.tablewrap th,.tablewrap td{padding:10px;border-bottom:1px solid #eee;text-align:right}.insight{padding:13px;border-radius:13px;background:#eff6ff;line-height:1.8}.warning{background:#fff7ed}.positive{background:#ecfdf5}.debug{margin-top:14px}.debug summary{cursor:pointer;font-weight:700}.debug pre{direction:ltr;text-align:left;white-space:pre-wrap;word-break:break-word;background:#0b1020;color:#d1fae5;padding:12px;border-radius:12px;font-size:11px}.error{white-space:pre-wrap;background:#fef2f2;color:#991b1b;padding:14px;border-radius:14px}.loading{padding:20px;text-align:center;color:#6b7280}@media(max-width:520px){h1{font-size:26px}.ask{flex-direction:column}.ask button{height:52px}.chart svg{min-width:480px}}</style></head><body><div class="hero"><div class="wrap"><h1>Qimam AI Sales</h1><div class="sub">بيانات Odoo الحقيقية مباشرة عبر MCP — اسأل بأي طريقة تريد</div><div class="ask"><input id="q" placeholder="مثال: اعرض المبيعات الشهرية لعام 2025"><button id="go">توليد</button></div><div class="examples" id="examples"></div></div></div><main class="main wrap"><div id="feed"><div class="card" id="empty">البيانات الآن تأتي من Odoo الحقيقي، وليست بيانات تجريبية.</div></div></main><script>
const feed=document.getElementById('feed'),q=document.getElementById('q'),go=document.getElementById('go'),examples=document.getElementById('examples');let lastPlan=null,n=0;
['كم إجمالي المبيعات المؤكدة؟','اعرض المبيعات الشهرية لعام 2025','من أعلى 10 عملاء مبيعاً؟','ما أعلى 10 منتجات مبيعاً بالكمية؟','ما آخر 10 أوامر بيع مؤكدة؟'].forEach(x=>{let b=document.createElement('button');b.className='chip';b.textContent=x;b.onclick=()=>q.value=x;examples.appendChild(b)});
async function post(url,body){let r=await fetch(url,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)}),d=await r.json().catch(()=>({}));if(!r.ok)throw Object.assign(new Error(d.error||'HTTP '+r.status),{detail:d.detail||d.raw});return d}
function fmt(v,f){if(typeof v!=='number')return v;if(f==='currency')return new Intl.NumberFormat('ar-SA',{maximumFractionDigits:2}).format(v)+' ر.س';if(f==='percent')return new Intl.NumberFormat('ar-SA',{style:'percent',maximumFractionDigits:1}).format(v);return new Intl.NumberFormat('ar-SA',{maximumFractionDigits:2}).format(v)}
function add(tag,cls,txt){let e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}function svgEl(name,attrs={}){let e=document.createElementNS('http://www.w3.org/2000/svg',name);Object.entries(attrs).forEach(([k,v])=>e.setAttribute(k,v));return e}function addTxt(svg,x,y,t,anchor='middle',size=11,fill='#64748b'){let z=svgEl('text',{x,y,'text-anchor':anchor,'font-size':size,fill});z.textContent=t;svg.append(z)}
function chart(c,host){let box=add('div','block'),h=add('h3',null,c.title||''),wrap=add('div','chart'),svg=svgEl('svg',{viewBox:'0 0 760 320'});wrap.append(svg);box.append(h,wrap);host.append(box);const W=760,H=320,L=62,R=24,T=24,B=58,PW=W-L-R,PH=H-T-B;let cats=Array.isArray(c.categories)?c.categories:[],series=Array.isArray(c.series)?c.series:[],palette=['#4f46e5','#16a34a','#ea580c','#0891b2','#9333ea'];if(c.type==='pie_chart'){let vals=(series[0]?.data||[]).map(Number),sum=vals.reduce((a,b)=>a+(isFinite(b)?b:0),0)||1,cx=380,cy=145,r=95,start=-Math.PI/2;vals.forEach((v,i)=>{let a=v/sum*Math.PI*2,end=start+a,x1=cx+r*Math.cos(start),y1=cy+r*Math.sin(start),x2=cx+r*Math.cos(end),y2=cy+r*Math.sin(end),large=a>Math.PI?1:0;svg.append(svgEl('path',{d:`M ${cx} ${cy} L ${x1} ${y1} A ${r} ${r} 0 ${large} 1 ${x2} ${y2} Z`,fill:palette[i%palette.length]}));start=end});cats.slice(0,8).forEach((x,i)=>{svg.append(svgEl('rect',{x:80+(i%4)*170,y:265+Math.floor(i/4)*20,width:10,height:10,rx:2,fill:palette[i%palette.length]}));addTxt(svg,96+(i%4)*170,274+Math.floor(i/4)*20,x,'start',10)});return}if(c.type==='scatter_chart'){let pts=(c.points||[]).filter(p=>isFinite(+p.x)&&isFinite(+p.y));if(!pts.length)return;let xs=pts.map(p=>+p.x),ys=pts.map(p=>+p.y),xmin=Math.min(...xs),xmax=Math.max(...xs),ymin=Math.min(...ys),ymax=Math.max(...ys);if(xmin===xmax){xmin--;xmax++}if(ymin===ymax){ymin--;ymax++}pts.forEach((p,i)=>svg.append(svgEl('circle',{cx:L+(+p.x-xmin)/(xmax-xmin)*PW,cy:T+PH-(+p.y-ymin)/(ymax-ymin)*PH,r:5,fill:palette[i%palette.length]})));return}let all=series.flatMap(s=>(s.data||[]).map(Number)).filter(isFinite);if(!all.length)return;let ymin=Math.min(...all),ymax=Math.max(...all);if(ymin>0)ymin=0;if(ymin===ymax)ymax=ymin+1;for(let i=0;i<=4;i++){let y=T+PH*i/4;svg.append(svgEl('line',{x1:L,y1:y,x2:W-R,y2:y,stroke:'#e5e7eb'}));addTxt(svg,L-8,y+4,fmt(ymax-(ymax-ymin)*i/4,'number'),'end',10)}if(c.type==='bar_chart'){let count=Math.max(1,cats.length),gw=PW/count,bw=Math.max(6,Math.min(36,gw/(series.length+1)));cats.forEach((cat,i)=>{series.forEach((s,j)=>{let v=+((s.data||[])[i]||0),bh=(v-ymin)/(ymax-ymin)*PH,x=L+i*gw+(gw-series.length*bw)/2+j*bw,y=T+PH-bh;svg.append(svgEl('rect',{x,y,width:bw-2,height:Math.max(0,bh),rx:3,fill:palette[j%palette.length]}))});addTxt(svg,L+i*gw+gw/2,H-30,String(cat).slice(0,14),'middle',10)})}else{series.forEach((s,j)=>{let vals=(s.data||[]).map(Number),pts=vals.map((v,i)=>[L+(cats.length<=1?PW/2:i*PW/(cats.length-1)),T+PH-(v-ymin)/(ymax-ymin)*PH]),d=pts.map((p,i)=>(i?'L':'M')+p[0]+' '+p[1]).join(' ');if(c.type==='area_chart'&&pts.length)svg.append(svgEl('path',{d:d+` L ${pts.at(-1)[0]} ${T+PH} L ${pts[0][0]} ${T+PH} Z`,fill:palette[j%palette.length],opacity:.14}));svg.append(svgEl('path',{d,fill:'none',stroke:palette[j%palette.length],'stroke-width':3}))});cats.forEach((cat,i)=>addTxt(svg,L+(cats.length<=1?PW/2:i*PW/(cats.length-1)),H-30,String(cat).slice(0,14),'middle',10))}}
function render(schema,host){if(schema.summary)host.append(add('p','summary',schema.summary));let ks=(schema.components||[]).filter(c=>c.type==='kpi');if(ks.length){let g=add('div','kpis');ks.forEach(c=>{let k=add('div','kpi');k.append(add('span',null,c.title),add('b',null,fmt(c.value,c.format)));g.append(k)});host.append(g)}for(let c of schema.components||[]){if(c.type==='kpi')continue;if(c.type.endsWith('_chart'))chart(c,host);else if(c.type==='insight')host.append(add('div','insight '+(c.severity||''),c.text));else if(c.type==='table'){let b=add('div','block'),h=add('h3',null,c.title||''),w=add('div','tablewrap'),t=document.createElement('table'),tr=document.createElement('tr');(c.columns||[]).forEach(x=>tr.append(add('th',null,x)));let th=document.createElement('thead');th.append(tr);t.append(th);let tb=document.createElement('tbody');(c.rows||[]).forEach(r=>{let tr=document.createElement('tr');r.forEach(x=>tr.append(add('td',null,x)));tb.append(tr)});t.append(tb);w.append(t);b.append(h,w);host.append(b)}}}
async function ask(){let text=q.value.trim();if(!text||go.disabled)return;n++;go.disabled=true;document.getElementById('empty')?.remove();let load=add('div','card loading','Claude يبني الاستعلام ← Odoo MCP ينفذ على البيانات الحقيقية ← Claude يبني العرض...');feed.prepend(load);try{let p=await post('/api/plan',{question:text,previousPlan:lastPlan}),ex=await post('/api/execute',{plan:p.plan}),results=ex.results,pr=await post('/api/present',{question:text,plan:p.plan,results}),card=add('div','card'),body=add('div');body.append(add('span','badge','LIVE ODOO MCP'),add('h2',null,pr.schema.title||text));render(pr.schema,body);let det=add('details','debug');det.append(add('summary',null,'لوحة المطوّر — إثبات المسار الحقيقي'));[['Claude Query Plan',p.plan],['Odoo MCP Results',results],['Data Source',ex.source],['Claude Presentation',pr.schema]].forEach(([a,b])=>det.append(add('h4',null,a),add('pre',null,typeof b==='string'?b:JSON.stringify(b,null,2))));card.append(add('div','q','سؤال '+n+': '+text),body,det);load.replaceWith(card);lastPlan=p.plan;q.value=''}catch(e){let er=add('div','card');er.append(add('div','error','فشل الطلب: '+e.message+(e.detail?'\n'+e.detail:'')));load.replaceWith(er)}finally{go.disabled=false}}
go.onclick=ask;q.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();ask()}});
</script></body></html>
