*{box-sizing:border-box}html,body{margin:0;background:#f7fafc;color:#09233d;font-family:"Segoe UI",Tahoma,Arial,sans-serif}.wrap{max-width:980px;margin:auto}.hero{position:relative;overflow:hidden;background:#fff;border-bottom:1px solid #dcebed;padding:18px}.brandrow{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:15px}.brand{display:flex;align-items:center;gap:9px;font-weight:800}.brandmark{width:40px;height:40px;border:6px solid #0b9da6;border-right-color:#ffae24;border-radius:50%;transform:rotate(-20deg)}.brandname{font-size:18px}.brandname small{display:block;color:#0b9da6;font-size:10px}.status{display:flex;align-items:center;gap:7px;background:#eafaf3;color:#148151;padding:8px 11px;border-radius:999px;font-size:11px;font-weight:800}.status i{width:8px;height:8px;background:#24be73;border-radius:50%;box-shadow:0 0 0 4px #24be7319}.composer{background:#fff;border:1px solid #cfe1e5;border-radius:24px;box-shadow:0 10px 34px #0a3a4b0d;padding:15px 15px 10px}.composer:focus-within{border-color:#0b9da6}.composer textarea{display:block;width:100%;min-height:104px;max-height:240px;resize:none;overflow-y:auto;border:0;outline:0;background:transparent;color:#102b43;font:inherit;font-size:17px;line-height:1.8}.composerbar{display:flex;justify-content:flex-end;border-top:1px solid #eef3f4;padding-top:10px}.send{border:0;border-radius:14px;padding:11px 18px;background:#0b9da6;color:#fff;font-weight:800;font-size:15px}.send:disabled{opacity:.55}.examples{display:flex;gap:8px;overflow:auto;padding:11px 2px 0;scrollbar-width:none}.chip{white-space:nowrap;border:1px solid #d4e7e9;background:#fbffff;color:#175263;padding:8px 12px;border-radius:999px;font-size:12px}.main{padding:20px 18px 60px}.card{background:#fff;border:1px solid #dfeaec;border-radius:22px;padding:20px;margin-bottom:18px;box-shadow:0 8px 28px #12394b0a;overflow:hidden}.q{font-weight:800;color:#087f88;margin-bottom:12px}.badge{display:inline-flex;background:#e8faf2;color:#128 <body><header class="hero"><div class="wrap"><div class="brandrow"><div class="brand"><span class="brandmark"></span><span class="brandname">قمم تك<small>Qimam Tech</small></span></div><div class="status"><i></i> LIVE ODOO MCP</div></div><div class="composer"><textarea id="q" rows="3" placeholder="اكتب سؤالك هنا…&#10;اطلب البيانات وشكل المخرجات بالطريقة التي تريدها"></textarea><div class="composerbar"><button class="send" id="go">إرسال ◀</button></div></div><div class="examples" id="examples"></div></div></header><main class="main wrap"><div id="feed"></div><div class="footer-note">قمم تك · LIVE ODOO MCP</div></main>
<script>
const feed=document.getElementById('feed'),q=document.getElementById('q'),go=document.getElementById('go'),examples=document.getElementById('examples');let lastPlan=null,n=0;
['صمم لي ملخص مالي 2025 بحرية وبأسلوب تنفيذي حديث','اعرض المبيعات الشهرية لعام 2025','من أعلى 10 عملاء مبيعاً؟'].forEach(x=>{let b=document.createElement('button');b.className='chip';b.textContent=x;b.onclick=()=>{q.value=x;grow();q.focus()};examples.append(b)});function grow(){q.style.height='auto';q.style.height=Math.min(q.scrollHeight,240)+'px'}q.oninput=grow;
async function post(url,body){let r=await fetch(url,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)}),d=await r.json().catch(()=>({}));if(!r.ok)throw Object.assign(new Error(d.error||'HTTP '+r.status),{detail:d.detail||d.raw});return d}
function add(t,c,x){let e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=String(x);return e}function fmt(v,f,c={}){if(typeof v!=='number')return v;let l=c.numberLocale||'en-US',o={maximumFractionDigits:2};if(f==='percent')return new Intl.NumberFormat(l,{style:'percent',maximumFractionDigits:1}).format(v);return new Intl.NumberFormat(l,o).format(v)+(f==='currency'?' '+(c.currencyLabel||'SAR'):'')}
const SAFE=new Set(['background','backgroundColor','backgroundImage','color','border','borderColor','borderWidth','borderStyle','borderRadius','boxShadow','padding','fontFamily','fontSize','fontWeight','letterSpacing','textAlign','minHeight','opacity','transform','lineHeight']);function style(e,o){if(!o||typeof o!=='object')return;for(let[k,v]of Object.entries(o))if(SAFE.has(k)&&typeof v==='string'&&v.length<240&&!/url\s*\(|javascript:|expression\s*\(/i.test(v))try{e.style[k]=v}catch{}}

const ICONS={trend:'M4 17l6-6 4 4 6-8 M15 7h5v5',revenue:'M5 7h14v10H5z M8 11h8 M12 9v4',receipt:'M6 3h12v18l-3-2-3 2-3-2-3 2z M9 8h6 M9 12h6',return:'M9 7H5v-4 M5 7c3-3 9-4 13 0 3 4 1 10-4 12-3 1-6 0-8-2',profit:'M5 12l4 4 10-10 M15 6h4v4',warning:'M12 4l9 16H3z M12 9v5 M12 17v.1',users:'M8 11a3 3 0 1 0 0-6 3 3 0 0 0 0 6 M3 20c0-4 3-6 5-6s5 2 5 6',cart:'M4 5h2l2 10h9l2-7H7 M10 19h.1 M17 19h.1',invoice:'M6 3h9l3 3v15H6z M14 3v4h4 M9 11h6 M9 15h6',chart:'M4 20V10 M10 20V4 M16 20v-7 M22 20H2',wallet:'M4 7h14a2 2 0 0 1 2 2v9H6a2 2 0 0 1-2-2z M16 11h5v4h-5',check:'M5 12l4 4L19 6',clock:'M12 4a8 8 0 1 0 0 16 8 8 0 0 0 0-16 M12 8v5l3 2',spark:'M12 3l2 6 6 2-6 2-2 6-2-6-6-2 6-2z'};
function icon(spec,cls,sty){let w=add('span',cls);style(w,sty);if(typeof spec==='string'){w.textContent=spec;return w}if(!spec)return w;let p=ICONS[String(spec.name||'spark').toLowerCase()]||ICONS.spark,size=Math.max(14,Math.min(+spec.size||36,180)),svg=se('svg',{viewBox:'0 0 24 24',width:size,height:size,fill:'none'});svg.append(se('path',{d:p,stroke:'currentColor','stroke-width':Math.max(.7,Math.min(+spec.strokeWidth||1.8,4)),'stroke-linecap':'round','stroke-linejoin':'round'}));w.style.fontSize=size+'px';if(spec.color)w.style.color=spec.color;if(spec.opacity!=null)w.style.opacity=spec.opacity;if(spec.rotation)w.style.transform=`rotate(${spec.rotation}deg)`;if(spec.background){w.style.background=spec.background;w.style.padding=spec.padding||'9px';w.style.borderRadius=spec.radius||'14px'}w.append(svg);return w}
function chart(c,host){let b=add('div','block'),h=add('h3',null,c.title||''),w=add('div','chart'),s=se('svg',{viewBox:'0 0 760 320'});w.append(s);b.append(h,w);host.append(b);let cats=Array.isArray(c.categories)?c.categories:[],ss=Array.isArray(c.series)?c.series:[],all=ss.flatMap(x=>Array.isArray(x.data)?x.data.map(Number):[]).filter(Number.isFinite),pal=['#0b9da6','#ffae24','#126b80','#65c9ce','#2aa46f'];if(!all.length)return;let L=60,T=24,PW=676,PH=238,min=Math.min(0,...all),max=Math.max(...all);if(max===min)max=min+1;for(let i=0;i<=4;i++){let y=T+PH*i/4;s.append(se('line',{x1:L,y1:y,x2:736,y2:y,stroke:'#e5edef'}));txt(s,L-7,y+4,fmt(max-(max-min)*i/4,'number',c),'end')}if(c.type==='bar_chart'){let gw=PW/Math.max(1,cats.length),bw=Math.max(6,Math.min(34,gw/(ss.length+1)));cats.forEach((cat,i)=>{ss.forEach((z,j)=>{let v=Number(z.data?.[i]||0),bh=(v-min)/(max-min)*PH;s.append(se('rect',{x:L+i*gw+(gw-ss.length*bw)/2+j*bw,y:T+PH-bh,width:bw-2,height:Math.max(0,bh),rx:4,fill:pal[j%pal.length]}))});txt(s,L+i*gw+gw/2,292,String(cat).slice(0,12))})}else{ss.forEach((z,j)=>{let pts=(z.data||[]).map((v,i)=>[L+(cats.length<=1?PW/2:i*PW/(cats.length-1)),T+PH-(Number(v)-min)/(max-min)*PH]),d=pts.map((p,i)=>(i?'L':'M')+p[0]+' '+p[1]).join(' ');if(d)s.append(se('path',{d,fill:'none',stroke:pal[j%pal.length],'stroke-width':3}))});cats.forEach((cat,i)=>txt(s,L+(cats.length<=1?PW/2:i*PW/(cats.length-1)),292,String(cat).slice(0,12)))}}
function layout(c){let l=c?.layout||{},span=Math.max(1,Math.min(+l.span||1,4)),variant=['hero','feature','compact','quiet'].includes(l.variant)?l.variant:'feature';return{span,variant,order:Number(l.order)||0,minHeight:l.minHeight||'',align:l.align||'start'}}
function renderComponent(c,cell){let l=layout(c);cell.dataset.variant=l.variant;cell.dataset.span=l.span;cell.style.setProperty('--span',l.span);cell.style.order=l.order;if(c.type==='kpi'){let k=add('div','kpi '+l.variant);style(k,c.style);if(l.minHeight)k.style.minHeight=l.minHeight;if(l.align==='center')k.style.textAlign='center';if(c.watermark)k.append(icon(c.watermark,'kpi-watermark',c.watermarkStyle));if(c.icon)k.append(icon(c.icon,'kpi-icon',c.iconStyle));let t=add('span','kpi-title',c.title||''),v=add('b','kpi-value',fmt(c.value,c.format,c));style(t,c.titleStyle);style(v,c.valueStyle);k.append(t,v);cell.append(k)}else if(c.type.endsWith('_chart'))chart(c,cell);else if(c.type==='insight'){let x=add('div','insight '+(c.severity||''),c.text||'');style(x,c.style);cell.append(x)}else if(c.type==='table'){let b=add('div','block'),h=add('h3',null,c.title||''),w=add('div','tablewrap'),t=document.createElement('table'),hr=document.createElement('tr'),cols=Array.isArray(c.columns)?c.columns:[];cols.forEach(x=>hr.append(add('th',null,x)));let th=document.createElement('thead');th.append(hr);t.append(th);let tb=document.createElement('tbody'),rows=Array.isArray(c.rows)?c.rows:[];rows.forEach(r=>{let tr=document.createElement('tr'),arr=Array.isArray(r)?r:(r&&typeof r==='object'?cols.map(x=>r[x]??''):[r]);arr.forEach(x=>tr.append(add('td',null,x??'')));tb.append(tr)});t.append(tb);w.append(t);b.append(h,w);cell.append(b)}}
function render(schema,host){if(schema?.summary)host.append(add('p','summary',schema.summary));let comps=Array.isArray(schema?.components)?schema.components:[],grid=add('div','gen-grid');comps.forEach(c=>{if(!c)return;let cell=add('div','gen-item');renderComponent(c,cell);grid.append(cell)});host.append(grid)}
function loader(){let c=add('div','card loading-card');c.innerHTML='<div class="loader-top"><div class="loader-orb"></div><div><div class="loader-title">نعمل على سؤالك</div><div class="loader-line"><span class="dots"><i></i><i></i><i></i></span><span id="lt"></span><span class="caret"></span></div></div></div>';return c}let run=0;async function type(el,s){let r=++run;el.textContent='';for(let x of s){if(r!==run)return;el.textContent+=x;await new Promise(a=>setTimeout(a,25+Math.random()*22))}}function stage(c,s){let e=c.querySelector('#lt');if(e)type(e,s)}
