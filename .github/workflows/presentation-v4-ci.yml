name: Presentation V4 CI

on:
  push:
    branches: [generative-presentation-v4]
    paths:
      - 'presentation-v4-*.js'
      - 'tests/presentation-v4-*.test.js'
      - 'tests/run-v4-tests.js'
      - 'package.json'
      - '.github/workflows/presentation-v4-ci.yml'
  workflow_dispatch:

jobs:
  test-v4:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax check
        run: |
          node --check presentation-v4-core.js
          node --check presentation-v4-catalog.js
          node --check presentation-v4-contract.js
          node --check presentation-v4-art-director.js
          node --check presentation-v4-envelope.js
          node --check presentation-v4-shadow.js
          node --check presentation-v4-anthropic.js
          node --check presentation-v4-shadow-preload.js
      - name: Run V4 isolated tests
        run: npm run test:v4
